# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  fuzzer:
    restart: unless-stopped

  gateway:
    restart: unless-stopped
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-https://studio.nexusgit.info}
      TRUST_PROXY: "true"
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      LEGAL_VERSION: ${LEGAL_VERSION:-1}
      MCP_TOKEN_TTL_DAYS: ${MCP_TOKEN_TTL_DAYS:-30}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://gateway.nexusgit.info}
      STUDIO_URL: ${STUDIO_URL:-https://studio.nexusgit.info}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-gateway.nexusgit.info}
      GATEWAY_UPSTREAM: gateway:8000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway

volumes:
  caddy-data:
  caddy-config:
